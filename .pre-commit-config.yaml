# Install once per clone: pre-commit install
# Run on everything:       pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: check-json
        exclude: ^ui/tsconfig.*\.json$ # JSONC (comments allowed)
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^demo/
      - id: trailing-whitespace
        exclude: ^demo/

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: (^ui/package-lock\.json$|^demo/)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (.venv/bin/mypy, whatever environment is active)
        entry: .venv/bin/mypy
        language: system
        types: [python]
        pass_filenames: false
