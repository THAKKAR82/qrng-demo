[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qrng-demo"
version = "0.1.0"
description = "Live demo: quantum vs. classical random bits, compared by attacker predictability."
readme = "README.md"
requires-python = ">=3.11"
# Exact pins live in requirements.txt / requirements-dev.txt. These are compatible ranges.
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "jsonschema>=4.18",
    "matplotlib>=3.9",
    "qiskit>=2.0",
    "qiskit-ibm-runtime>=0.40",
    "jupyterlab>=4.0",
    "nbconvert>=7.0",
    "ipykernel>=6.0",
]

[project.optional-dependencies]
dev = [
    "qiskit-aer>=0.17",
    "ruff",
    "mypy",
    "pytest",
    "nbmake",
    "pre-commit",
    "detect-secrets",
]

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["ui", "demo", "scratch", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PTH", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["pipeline", "tests"]

[[tool.mypy.overrides]]
module = [
    "qiskit.*",
    "qiskit_ibm_runtime.*",
    "matplotlib.*",
    "requests.*",
    "qiskit_aer.*",
    "scipy.*",
    "jsonschema.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "hardware: would contact IBM Quantum; never run by Claude or CI (none exist yet)",
]
